version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: greenweez raw data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: green weez purchases of items with revenue
        columns:
          - name: date_date
            description: date of purchase
          - name: orders_id
            description: id of order created
          - name: pdt_id
            description: id of product that was purchased
          - name: revenue
            description: amount made from purchase
          - name: quanity
            description: amount of products purchased
        tests:
          - unique:
              column_name: "(orders_id || '-' || pdt_id)"
      - name: product
        identifier: raw_gz_product
        description: green weez table of each product id with their prices
        columns:
          - name: products_id
            description: id of greenweez product
            tests:
              - unique
              - not_null
          - name: purchSE_PRICE
            description: purchase price of greenweez product
      - name: ship
        identifier: raw_gz_ship
        description: green weez table of shipping fees for each order
        columns:
          - name: orders_id
            description: orders id
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: price customer pays to get the order delivered
          - name: shipping_fee_1
            description: price customer pays to get the order delivered (duplicate column of shipping_fee)
          - name: logCost
            description: the natural log of the cost amount to normalize large values for better analysis
          - name: ship_cost
            description: the cost to greenweez to deliver order
      - name: adwords
        identifier: raw_gz_adwords
        description: campaign data for adwords
        columns:
          - name: date_date
            description: date campaign was run
            tests:
              - not_null
          - name: paid_source
            description: name of company that paid for the campaign
            tests:
              - not_null
          - name: campaign_key
            description: unique key for campaign
            tests:
              - not_null
          - name: camPGN_name
            description: name of campaign
            tests:
              - not_null
          - name: ads_cost
            description: cost of the ad
            tests:
              - not_null
          - name: impression
            description: number of times an advertisement is displayed or shown to users
            tests:
              - not_null
          - name: click
            description: clicks are the number of times users actually click on an advertisement
            tests:
              - not_null
        tests:
          - unique:
              column_name: "(campaign_key|| '-' || date_date)"
      - name: bing
        identifier: raw_gz_bing
        description: campaign data for bing
        columns:
          - name: date_date
            description: date campaign was run
            tests:
              - not_null
          - name: paid_source
            description: name of company that paid for the campaign
            tests:
              - not_null
          - name: campaign_key
            description: unique key for campaign
            tests:
              - not_null
          - name: camPGN_name
            description: name of campaign
            tests:
              - not_null
          - name: ads_cost
            description: cost of the ad
            tests:
              - not_null
          - name: impression
            description: number of times an advertisement is displayed or shown to users
            tests:
              - not_null
          - name: click
            description: clicks are the number of times users actually click on an advertisement
            tests:
              - not_null
        tests:
          - unique:
              column_name: "(campaign_key|| '-' || date_date)"
      - name: criteo
        identifier: raw_gz_criteo
        description: campaign data for criteo
        columns:
          - name: date_date
            description: date campaign was run
            tests:
              - not_null
          - name: paid_source
            description: name of company that paid for the campaign
            tests:
              - not_null
          - name: campaign_key
            description: unique key for campaign
            tests:
              - not_null
          - name: camPGN_name
            description: name of campaign
            tests:
              - not_null
          - name: ads_cost
            description: cost of the ad
            tests:
              - not_null
          - name: impression
            description: number of times an advertisement is displayed or shown to users
            tests:
              - not_null
          - name: click
            description: clicks are the number of times users actually click on an advertisement
            tests:
              - not_null
        tests:
          - unique:
              column_name: "(campaign_key|| '-' || date_date)"
      - name: facebook
        identifier: raw_gz_facebook
        description: campaign data for facebook
        columns:
